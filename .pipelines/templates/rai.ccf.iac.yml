parameters:
  - name: armFilePath
    type: string
    default: 'default'
  
  - name: repoUrl
    type: string
    default: 'https://github.com/RakeemRanger/ProdEngAgent'

steps:
  - checkout: ${{ parameters.repoUrl }}
  - task: CmdLine@2
    displayName: Test File Path

  - ${{ if ne(parameters.armFilePath, 'default') }}:
    - ${{ if contains(paramerters.repoUrl, 'github) }}:
      script: test -s ${{ parameters.armFilePath }}
