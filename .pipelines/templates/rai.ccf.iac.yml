parameters:
  - name: armFilePath
    type: string
    default: 'default'

steps:
  - ${{if ne(parameters.armFilePath, 'default')}}:
  - script: test -s ${{parameters.sourcePath }}
  - task: MicrosoftSecurityDevOps@1
    displayName: RAI CCF ARM Scan
    inputs:
      categories: 'IaC'
      file: ${{ parameters.armFilePath }}
      break: true
  - task: publishToAdvancedSecurity
    displayName: Publish ARM Scan Results