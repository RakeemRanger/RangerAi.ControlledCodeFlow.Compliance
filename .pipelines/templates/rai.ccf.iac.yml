parameters:
  - name: armFilePath
    type: string
    default: 'default'
  
  - name: repoUrl
    type: string

steps:
  - checkout: ${{ parameters.repoUrl }}
  - task: CmdLine@2
    displayName: Test File Path

  - ${{ if ne(parameters.armFilePath, 'default') }}:
    script: test -s ${{ parameters.armFilePath }}
